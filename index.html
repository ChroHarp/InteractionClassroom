<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14213a">
  <title>平興數資・探索教室</title>
  <meta name="description" content="走進平興國中數理資優班的探索教室，認識課程、作品與學習成果。">
  <link rel="canonical" href="https://interaction-classroom.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:url" content="https://interaction-classroom.vercel.app/">
  <meta property="og:title" content="平興數資・探索教室">
  <meta property="og:description" content="走進平興國中數理資優班的探索教室，認識課程、作品與學習成果。">
  <meta property="og:image" content="https://interaction-classroom.vercel.app/assets/classroom/room/classroom-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="平興數資探索教室全景，右牆有行星壁畫、活動照片與十週年壓克力海報。">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="平興數資・探索教室">
  <meta name="twitter:description" content="走進平興國中數理資優班的探索教室，認識課程、作品與學習成果。">
  <meta name="twitter:image" content="https://interaction-classroom.vercel.app/assets/classroom/room/classroom-preview.jpg">
  <meta name="twitter:image:alt" content="平興數資探索教室全景，右牆有行星壁畫、活動照片與十週年壓克力海報。">
  <link rel="stylesheet" href="assets/classroom/classroom.css">
  <link rel="stylesheet" href="assets/classroom/content.css">
  <script>
    if (location.protocol === "file:") document.documentElement.dataset.localFile = "";
  </script>
  <script type="module" src="assets/classroom/classroom.js"></script>
</head>
<body>
  <main class="shell">
    <div class="room" id="room">
      <h1 class="visually-hidden">平興國中數理資優班探索教室</h1>

      <div class="viewport" id="viewport" tabindex="-1">
        <div class="pointer-rig" id="pointer-rig">
          <div class="world" id="world">
            <img class="scene-art" src="assets/classroom/room/classroom-preview.jpg" width="1200" height="630" alt="探索教室真 3D 場景：斜向藍綠天花格柵、行星壁畫、彩色實驗器材、三色創客櫃與顯示平興數資 LOGO 的橫式教學螢幕。">
            <div id="hotspots">
              <a class="poster-link" id="poster-link" href="https://www.psjh.tyc.edu.tw/PSJHGifted/" aria-label="前往平興數資官網" title="前往平興數資官網" hidden>
                <span class="hotspot-marker" aria-hidden="true"></span>
              </a>
            </div>
          </div>
        </div>
        <div class="video-stage" id="video-stage" hidden></div>
      </div>

      <div class="pan-hint" id="pan-hint" aria-hidden="true" hidden>
        <span class="pan-hint-text">← 左右滑動探索教室 →</span>
        <span class="pan-track"><span class="pan-thumb" id="pan-thumb"></span></span>
      </div>

      <header class="mobile-focus-bar" id="mobile-focus-bar" hidden>
        <button class="back mobile-back" id="mobile-back" type="button"><span aria-hidden="true">←</span> 返回全景</button>
        <p class="mobile-focus-title" id="mobile-focus-title" tabindex="-1"></p>
      </header>

      <nav class="scene-navigation" id="scene-navigation" aria-label="教室物件導覽">
        <button type="button" id="previous-object" aria-label="上一個物件"><span aria-hidden="true">←</span></button>
        <div class="scene-navigation-center">
          <p id="scene-status" role="status">選擇教室物件</p>
          <button type="button" class="nav-drawer-toggle" id="nav-drawer-toggle" aria-expanded="false" aria-controls="nav-drawer" hidden>
            <span class="nav-drawer-label" id="nav-drawer-label">探索教室 · 10 個物件</span>
            <span class="nav-drawer-caret" aria-hidden="true">▴</span>
          </button>
          <div class="nav-drawer" id="nav-drawer">
            <div class="entrances" id="entrances" aria-label="教室物件"></div>
            <p class="content-links"><a href="content.html">課程與作品目錄</a> · <a href="https://lin.ee/twA52IQj" target="_blank" rel="noopener">聯絡我們</a></p>
          </div>
        </div>
        <button type="button" id="next-object" aria-label="下一個物件"><span aria-hidden="true">→</span></button>
      </nav>
      <button class="back" id="exit-focus" type="button" hidden>返回全景</button>
      <section class="detail" id="detail" aria-labelledby="detail-title" hidden>
        <header class="detail-header">
          <h2 id="detail-title" tabindex="-1"></h2>
          <button class="back" id="back" type="button">返回全景</button>
        </header>
        <div id="learning-content" class="learning-content" hidden></div>
        <p id="detail-copy"></p>
        <div id="awards-panel" class="awards-panel" hidden>
          <div class="awards-sticky-top">
            <form id="awards-filters" class="awards-filters" aria-label="搜尋獎項">
              <label class="awards-search">搜尋獎項<input type="search" name="q" maxlength="120" placeholder="輸入年份、作品、競賽或獎項" disabled></label>
            </form>
            <div class="awards-legend" aria-label="獎項強調色圖例">
              <span class="legend-item"><i class="legend-swatch tier-super" aria-hidden="true"></i>國際／全國大獎</span>
              <span class="legend-item"><i class="legend-swatch tier-major" aria-hidden="true"></i>全國入選／市賽首獎</span>
              <span class="legend-item"><i class="legend-swatch tier-mid" aria-hidden="true"></i>市賽佳績</span>
              <span class="legend-item"><i class="legend-swatch tier-normal" aria-hidden="true"></i>入選／區賽</span>
            </div>
            <div class="awards-year-nav" aria-label="年度滑桿導覽">
              <button id="awards-prev-year" class="awards-scroll-btn" type="button" aria-label="往較早年份捲動">‹</button>
              <input id="awards-year-range" class="awards-year-range" type="range" min="0" max="1000" value="1000" aria-label="左右滑動切換年份" disabled>
              <button id="awards-next-year" class="awards-scroll-btn" type="button" aria-label="往較新年份捲動">›</button>
            </div>
            <div class="awards-summary">
              <p id="awards-status" role="status" tabindex="-1"></p>
              <button id="awards-clear" type="button" hidden>清除搜尋</button>
              <button id="awards-retry" type="button" hidden>重新載入</button>
            </div>
          </div>
          <div id="awards-results" class="awards-results" role="region" aria-label="歷屆獲獎年度牆" aria-busy="false"></div>
        </div>
      </section>
      <noscript>
        <p class="no-script"><a href="content.html">閱讀課程與作品目錄</a>，或開啟 JavaScript 操作教室。
        </p>
      </noscript>
      <p class="local-file-notice">
        請透過本機預覽開啟教室，才能使用物件入口。
        <a href="http://127.0.0.1:8765/">開啟本機預覽</a>
      </p>
    </div>
  </main>
</body>
</html>
