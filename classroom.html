<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14213a">
  <title>平興數資・探索教室</title>
  <link rel="stylesheet" href="assets/classroom/classroom.css">
  <script type="module" src="assets/classroom/classroom.js"></script>
</head>
<body>
  <main class="shell">
    <div class="room" id="room">
      <header class="masthead">
        <h1>探索教室 <span>平興國中數理資優班</span></h1>
        <nav class="views" aria-label="教室視角">
          <button type="button" data-view="overview" aria-pressed="true">全景</button>
          <button type="button" data-view="front" aria-pressed="false">前方</button>
          <button type="button" data-view="work" aria-pressed="false">實作區</button>
          <button type="button" data-view="wall" aria-pressed="false">成果牆</button>
        </nav>
        <button class="motion-option" id="motion-option" type="button" aria-pressed="false">減少動態</button>
      </header>

      <div class="viewport" id="viewport">
        <div class="pointer-rig" id="pointer-rig">
          <div class="world" id="world">
            <img class="scene-art" src="assets/classroom/room/empty.webp" width="1672" height="941" alt="參考高斯與法拉第教室繪製的像素空間，黑色天花板上有綠色與藍色的格柵及白色圓燈。">
            <div id="hotspots"></div>
          </div>
        </div>
      </div>

      <nav class="scene-navigation" aria-label="教室物件導覽">
        <button type="button" id="previous-object" aria-label="上一個物件"><span aria-hidden="true">←</span></button>
        <div class="scene-navigation-center">
          <p id="scene-status" role="status">選擇教室物件</p>
          <div class="entrances" id="entrances" aria-label="教室物件"></div>
        </div>
        <button type="button" id="next-object" aria-label="下一個物件"><span aria-hidden="true">→</span></button>
      </nav>
      <button class="back" id="exit-focus" type="button" hidden>返回原視角</button>
      <section class="detail" id="detail" aria-labelledby="detail-title" hidden>
        <header class="detail-header">
          <h2 id="detail-title" tabindex="-1"></h2>
          <button class="back" id="back" type="button">返回原視角</button>
        </header>
        <p id="detail-copy"></p>
        <div class="video-panel" id="video-panel" hidden>
          <div class="video-stage" id="video-stage">
            <button class="video-play" id="video-play" type="button">
              <span aria-hidden="true"></span>播放宣傳影片
            </button>
          </div>
          <a class="video-link" href="https://www.youtube.com/watch?v=z2E_-Mv_YxM" target="_blank" rel="noopener noreferrer">在 YouTube 開啟<span aria-hidden="true"> ↗</span></a>
        </div>
        <div id="awards-panel" hidden>
          <form id="awards-filters" class="awards-filters" aria-label="篩選獎項">
            <label>年份<select name="year" disabled></select></label>
            <label>類別<select name="category" disabled></select></label>
            <label class="awards-search">搜尋獎項<input type="search" name="q" maxlength="120" placeholder="作品、競賽或獎項" disabled></label>
          </form>
          <div class="awards-summary">
            <p id="awards-status" role="status" tabindex="-1"></p>
            <button id="awards-clear" type="button" hidden>清除篩選</button>
            <button id="awards-retry" type="button" hidden>重新載入</button>
          </div>
          <ol id="awards-results" class="awards-results" aria-label="獎項清單" aria-busy="false"></ol>
        </div>
      </section>
      <noscript>
        <p class="no-script">開啟 JavaScript 即可操作教室入口。
        </p>
      </noscript>
    </div>
  </main>
</body>
</html>
